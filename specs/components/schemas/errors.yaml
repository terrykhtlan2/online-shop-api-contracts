ProblemDetails:
  type: object
  required: [type, title, status]
  properties:
    type:
      type: string
      example: https://api.online-shop.com/errors/product-not-found
    title:
      type: string
      example: Resource not found
    status:
      type: integer
      example: 404
    detail:
      type: string
    instance:
      type: string
    correlationId:
      type: string
