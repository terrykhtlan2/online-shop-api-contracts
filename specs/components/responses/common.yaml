# specs/components/responses/common.yaml
Accepted:
  description: The request has been accepted and queued.
  content:
    application/json:
      schema:
        $ref: '../schemas/notification.yaml#/components/schemas/NotificationResponse'

BadRequest:
  description: Bad request
  content:
    application/json:
      schema:
        $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'

NotFound:
  description: Resource not found
  content:
    application/json:
      schema:
        $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'

InternalServerError:
  description: Internal server error
  content:
    application/json:
      schema:
        $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
