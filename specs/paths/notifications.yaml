# specs/domains/notifications/paths.yaml

/notifications:
  post:
    tags:
      - Notifications
    summary: Dispatch enterprise notification
    operationId: sendNotification

    parameters:
      - $ref: '../../components/parameters/headers.yaml#/IdempotencyKeyHeader'
      - $ref: '../../components/parameters/headers.yaml#/CorrelationIdHeader'
      - $ref: '../../components/parameters/headers.yaml#/RequestIdHeader'
      - $ref: '../components/parameters/headers.yaml#/TraceParentHeader'
      - $ref: '../../components/parameters/headers.yaml#/LanguageParam'
      - name: channel
        in: query
        required: true
        schema:
          type: string
          enum: [email, sms, push, whatsapp]

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/notification.yaml#/NotificationRequest'

    responses:
      '202':
        $ref: '../../components/responses/common.yaml#/Accepted'
      '400':
        $ref: '../../components/responses/common.yaml#/BadRequest'
      '429':
        description: Too many requests
      '500':
        $ref: '../../components/responses/common.yaml#/InternalServerError'
