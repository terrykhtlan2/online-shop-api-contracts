# This file handles the HTTP methods for Products
/products:
  get:
    tags: 
      - Products
    summary: Retrieve product catalogue
    operationId: getProducts
    description: Returns a paginated list of all products in the shop.
    
    parameters:
      - $ref: '../components/parameters/headers.yaml#/PageParam'
      - $ref: '../components/parameters/headers.yaml#/PageSizeParam'
      - $ref: '../components/parameters/headers.yaml#/CorrelationIdHeader'
  
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../components/schemas/product.yaml#/ProductListResponse'
      '400':
        $ref: '../components/responses/common.yaml#/BadRequest'
      '500':
        $ref: '../components/responses/common.yaml#/InternalServerError'

  post:
    tags: 
      - Products
    summary: Create a new product
    operationId: createProduct
    description: Adds a new product to the inventory. Requires enterprise admin perms.
    
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/product.yaml#/Product'
    
    responses:
      '201':
        description: Product created successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/product.yaml#/Product'
      '400':
        $ref: '../components/responses/common.yaml#/BadRequest'
      '401':
        description: Unauthorized - Missing or invalid authentication
      '403':
        description: Forbidden - Enterprise admin permissions required
      '500':
        $ref: '../components/responses/common.yaml#/InternalServerError'

/products/{productId}:
  get:
    tags: 
      - Products
    summary: Retrieve product by ID
    operationId: getProductById
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      - $ref: '../components/parameters/headers.yaml#/CorrelationIdHeader'
    responses:
      '200':
        description: Product details
        content:
          application/json:
            schema:
              $ref: '../components/schemas/product.yaml#/Product'
      '404':
        $ref: '../components/responses/common.yaml#/NotFound'
      '400':
        $ref: '../components/responses/common.yaml#/BadRequest'
      '500':
        $ref: '../components/responses/common.yaml#/InternalServerError'
