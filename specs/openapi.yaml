openapi: 3.0.3

info:
  title: MyAPITerry Online Shop API
  description: |
    Enterprise REST API for an online shopping platform.
    This API manages products, customers, orders, payments, inventory, and notifications.
    The API follows a Design-First approach.
  version: 1.0.0
  contact:
    name: Terry K
    email: terryk@company.com.au

# 🔐 GLOBAL SECURITY
security:
  - BearerAuth: []

servers:
  - url: https://virtserver.swaggerhub.com/TERRYKHTLAN2_1/MyAPITerry/1.0.0
    description: SwaggerHub API Auto Mocking
  - url: https://{environment}-api.online-shop.com/{basePath}
    description: Enterprise API environments
    variables:
      environment:
        default: dev
        enum: [dev, sit, uat, prod]
      basePath:
        default: v1

tags:
  - name: Products
  - name: Notifications

# 🏗️ DOMAIN ORCHESTRATION
paths:
  /products:
    $ref: './paths/products.yaml'
  /products/{productId}:
    $ref: './paths/products.yaml#/~1products~1{productId}'
  /notifications:
    $ref: './paths/notifications.yaml'

# 🧩 SHARED ENTERPRISE COMPONENTS
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # These now point to your modular files
  parameters:
    $ref: './components/parameters/headers.yaml'
  
  schemas:
    Product:
      $ref: './components/schemas/product.yaml'
    NotificationRequest:
      $ref: './components/schemas/notification.yaml#/NotificationRequest'
    NotificationResponse:
      $ref: './components/schemas/notification.yaml#/NotificationResponse'
    # ... Add others as you move them

  responses:
    $ref: './components/responses/common.yaml'
